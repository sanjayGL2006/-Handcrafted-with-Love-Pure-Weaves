# Pure Weaves - Netlify Configuration
# Place this file in your project root

[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'"

[[headers]]
  for = "/admin.html"
  [headers.values]
    # Extra security for admin page
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

# Redirects
[[redirects]]
  from = "/api/*"
  to = "https://pure-weaves-backend.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/logout"
  to = "https://pure-weaves-backend.onrender.com/logout"
  status = 200

[[redirects]]
  from = "/"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/404"
  to = "/login.html"
  status = 301
