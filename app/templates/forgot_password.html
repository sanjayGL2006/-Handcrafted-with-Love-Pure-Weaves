{% extends "base.html" %}
{% block title %}Forgot Password - Pure Weaves{% endblock %}
{% block content %}
<div style="display:flex;justify-content:center;align-items:center;padding:4rem 1.5rem;">
  <div style="background:var(--white);border-radius:var(--radius);padding:2rem;width:100%;max-width:400px;box-shadow:0 10px 30px var(--shadow);">
    <h2 style="font-family:'Playfair Display',serif;color:var(--maroon);text-align:center;margin-bottom:1.5rem;">Reset Password</h2>
    <p style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:1.5rem;">Enter your Gmail address to receive a password reset link.</p>
    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div style="margin-bottom:1.5rem;">
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--text);">Gmail Address</label>
        <input type="email" name="email" class="search-input" style="width:100%;" required>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Send Reset Link</button>
    </form>
    <div style="text-align:center;margin-top:1.5rem;font-size:13px;">
      Remembered your password? <a href="{{ url_for('auth.login') }}" style="color:var(--gold);font-weight:700;">Login</a>
    </div>
  </div>
</div>
{% endblock %}
